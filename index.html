<!DOCTYPE html>
<html>
    <head>
        <title>Guess the Secret Number</title>
    </head>
<body>
    <h1>Guess the Secret Number</h1>
    <input type="number" id="guess" min="1" max="10">
    <button onclick="checkGuess()">Guess</button>
    <p id="result"></p>
    <script>
        const secretNumber = 7;

        function checkGuess() {
            const userGuess = parseInt(document.getElementById('guess').value);
            const resultElement = document.getElementById('result');

            if (userGuess === secretNumber) {
                resultElement.textContent = 'Congratulations! You guessed the secret number!';
            } else if (userGuess < secretNumber) {
                resultElement.textContent = 'Too low! Try again.';
            } else {
                resultElement.textContent = 'Too high! Try again.';
            }
        }
    </script>
</body>
</html>
